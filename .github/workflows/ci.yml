name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --check server.js
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t pine:test .
      - name: Smoke test
        run: |
          docker run -d --name pine -p 3000:3000 pine:test
          for i in $(seq 1 20); do
            curl -fs http://127.0.0.1:3000/healthz && break || sleep 1
          done
          curl -fs http://127.0.0.1:3000/api/config | grep -q '"engines"'
          curl -fsI http://127.0.0.1:3000/scram/scramjet.wasm | grep -qi 'application/wasm'
          docker logs pine
          docker rm -f pine
