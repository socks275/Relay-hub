name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Check the built site
        run: |
          set -e
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/scram/scramjet.wasm
          test -f dist/controller/controller.sw.js
          test -f dist/clients/libcurl-client.js
          test -f dist/relay-config.js
          grep -q 'relay-config.js' dist/index.html
          ! grep -q '__BASE__' dist/404.html
