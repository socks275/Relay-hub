services:
  pine:
    build: .
    image: pine-hub
    container_name: pine
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Set PINE_PASS to require a password (user: PINE_USER, default "pine").
      PINE_PASS: "${PINE_PASS:-}"
      PINE_USER: "${PINE_USER:-pine}"
      PINE_LOG_LEVEL: "${PINE_LOG_LEVEL:-info}"
      PINE_RATE_LIMIT: "${PINE_RATE_LIMIT:-0}"
