# Pine on Fly.io — `fly launch --copy-config --now`
# Change `app` to something unique. Set a password with: fly secrets set PINE_PASS=...
app = "pine-hub"
primary_region = "lhr"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 250
    hard_limit = 300

[[http_service.checks]]
  interval = "15s"
  timeout = "3s"
  grace_period = "8s"
  method = "GET"
  path = "/healthz"

[env]
  PINE_LOG_LEVEL = "info"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
