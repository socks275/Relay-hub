<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Relay — Browse</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/theme.css">
<style>
  body { display: flex; flex-direction: column; }

  /* ---------- backdrop (blurred, keeps hub continuity) ---------- */
  .backdrop .bgimg { filter: blur(26px) saturate(1.1) brightness(.7); transform: scale(1.14); animation: none; }
  .backdrop::after {
    background:
      radial-gradient(120% 90% at 50% 30%, transparent 20%, rgba(3, 6, 12, .62) 85%, rgba(2, 4, 9, .95) 100%),
      linear-gradient(180deg, rgba(3, 6, 12, .35), rgba(3, 6, 12, .6));
  }

  /* ---------- tabs ---------- */
  .tabstrip {
    position: relative; z-index: 20;
    display: flex; align-items: flex-end; gap: 4px;
    padding: 8px 12px 0;
    overflow-x: auto; overflow-y: hidden;
    scrollbar-width: none;
    flex: 0 0 auto;
  }
  .tabstrip::-webkit-scrollbar { display: none; }
  .tab {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 10px 8px 12px;
    min-width: 120px; max-width: 220px;
    border-radius: 11px 11px 0 0;
    border: 1px solid transparent; border-bottom: 0;
    background: transparent;
    color: rgba(186, 204, 228, .72);
    font: 500 11.5px/1 var(--sans);
    cursor: pointer;
    transition: background .16s, color .16s, border-color .16s;
    flex: 0 0 auto;
  }
  .tab:hover { background: rgba(148, 176, 214, .1); color: #dfe9f7; }
  .tab.on {
    background: rgba(10, 16, 28, .72);
    border-color: var(--glass-line);
    color: #eaf2ff;
  }
  .tab .fav {
    width: 14px; height: 14px; border-radius: 4px; flex: 0 0 auto;
    display: grid; place-items: center;
    font: 700 8px/1 var(--sans); color: #06101c;
    background: linear-gradient(180deg, #cfe4ff, #93c5fd);
  }
  .tab .tlabel { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .tab .x {
    width: 16px; height: 16px; flex: 0 0 auto;
    display: grid; place-items: center;
    border-radius: 5px; border: 0; background: transparent;
    color: inherit; cursor: pointer; opacity: .55;
  }
  .tab .x:hover { background: rgba(251, 113, 133, .22); opacity: 1; }
  .tab .x svg { width: 9px; height: 9px; }
  .newtab {
    width: 28px; height: 28px; flex: 0 0 auto;
    display: grid; place-items: center; align-self: center;
    border-radius: 8px; border: 1px solid transparent; background: transparent;
    color: rgba(186, 204, 228, .7); cursor: pointer;
  }
  .newtab:hover { background: rgba(148, 176, 214, .14); color: #fff; }
  .newtab svg { width: 13px; height: 13px; }

  body.no-tabs .tabstrip { display: none; }

  /* ---------- bar ---------- */
  .bar {
    position: relative; z-index: 20;
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px;
    flex-wrap: nowrap;
  }
  .brand {
    display: flex; align-items: center; gap: 9px;
    padding-right: 6px; flex: 0 0 auto;
    text-decoration: none; color: inherit;
  }
  .brand .mark {
    width: 32px; height: 32px; border-radius: 10px;
    display: grid; place-items: center;
    border: 1px solid rgba(251, 191, 36, .35);
    background: linear-gradient(180deg, rgba(28, 22, 12, .8), rgba(12, 12, 16, .8));
    color: var(--gold);
    box-shadow: 0 8px 22px -12px rgba(0, 0, 0, .9), inset 0 1px 0 rgba(255, 255, 255, .08);
  }
  .brand .mark svg { width: 17px; height: 17px; }
  .brand .txt { display: flex; flex-direction: column; line-height: 1.05; }
  .brand .txt b { font: 500 13px/1 var(--sans); letter-spacing: .3em; text-transform: lowercase; color: #eaf2ff; }
  .brand .txt i { font: 600 8px/1 var(--sans); letter-spacing: .24em; text-transform: uppercase; font-style: normal; color: rgba(186, 204, 228, .5); margin-top: 3px; }

  .navgroup { display: flex; gap: 2px; flex: 0 0 auto; }
  .iconbtn {
    width: 32px; height: 32px; display: grid; place-items: center;
    border-radius: 10px; border: 1px solid transparent;
    background: transparent; color: rgba(200, 216, 238, .8);
    cursor: pointer; transition: .15s;
    flex: 0 0 auto;
  }
  .iconbtn:hover { background: rgba(148, 176, 214, .14); color: #fff; border-color: var(--glass-line); }
  .iconbtn:disabled { opacity: .3; cursor: default; background: transparent; border-color: transparent; }
  .iconbtn svg { width: 15px; height: 15px; }
  .iconbtn.on { background: rgba(125, 211, 252, .16); color: #cfeaff; border-color: rgba(125, 211, 252, .3); }

  .addr {
    flex: 1 1 auto; min-width: 0;
    display: flex; align-items: center; gap: 9px;
    padding: 6px 6px 6px 13px;
    border-radius: var(--r-pill);
    border: 1px solid var(--glass-line);
    background: rgba(9, 15, 26, .66);
    backdrop-filter: blur(20px) saturate(1.2);
    -webkit-backdrop-filter: blur(20px) saturate(1.2);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06);
    transition: border-color .2s, box-shadow .2s;
  }
  .addr:focus-within { border-color: rgba(125, 211, 252, .55); box-shadow: 0 0 0 3px rgba(125, 211, 252, .10), inset 0 1px 0 rgba(255, 255, 255, .08); }
  .addr .lock { flex: 0 0 auto; color: rgba(52, 211, 153, .85); display: grid; place-items: center; }
  .addr .lock svg { width: 12px; height: 12px; }
  .addr .lock.insecure { color: var(--gold); }
  #url {
    flex: 1; min-width: 40px; border: 0; outline: 0; background: transparent;
    color: #e6eefb; font: 400 12.5px/1.4 var(--mono);
    padding: 5px 0;
    text-overflow: ellipsis;
  }
  #url::placeholder { color: rgba(160, 180, 206, .5); font-family: var(--sans); }
  .addr .go-btn {
    flex: 0 0 auto; width: 26px; height: 26px;
    display: grid; place-items: center;
    border-radius: 99px; border: 0; cursor: pointer;
    background: linear-gradient(180deg, #e8f4ff, #bcdcfb); color: #10203a;
  }
  .addr .go-btn svg { width: 12px; height: 12px; }

  .split { flex: 0 0 auto; display: flex; align-items: center; }
  .seg {
    display: flex; gap: 2px; padding: 3px;
    border-radius: var(--r-pill);
    border: 1px solid var(--glass-line);
    background: rgba(9, 15, 26, .6);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }
  .seg button {
    display: inline-flex; align-items: center; gap: 5px;
    border: 0; background: transparent; color: rgba(186, 204, 228, .8);
    font: 600 10.5px/1 var(--sans); letter-spacing: .06em;
    padding: 7px 10px; border-radius: var(--r-pill); cursor: pointer;
    transition: .16s;
  }
  .seg button svg { width: 12px; height: 12px; }
  .seg button:hover { color: #fff; }
  .seg button.on { background: linear-gradient(180deg, #e8f4ff, #bcdcfb); color: #10203a; box-shadow: 0 6px 16px -10px rgba(190, 220, 255, .9); }

  .bar .pill-btn { padding: 9px 12px; }

  /* ---------- viewport ---------- */
  .viewport {
    position: relative; z-index: 10;
    flex: 1 1 auto; min-height: 0;
    margin: 0 12px calc(12px + env(safe-area-inset-bottom));
    border-radius: 16px;
    border: 1px solid rgba(190, 215, 255, .18);
    background: #0a0f18;
    overflow: hidden;
    box-shadow: 0 40px 120px -40px rgba(0, 0, 0, .95), inset 0 1px 0 rgba(255, 255, 255, .05);
  }
  #frame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }

  .progress {
    position: absolute; top: 0; left: 0; right: 0; height: 2px; z-index: 15;
    overflow: hidden; opacity: 0; transition: opacity .2s;
    background: rgba(148, 163, 184, .12);
  }
  .progress.on { opacity: 1; }
  .progress::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 34%;
    background: linear-gradient(90deg, transparent, #7dd3fc, #fbbf24, transparent);
    animation: slide 1.1s ease-in-out infinite;
  }
  @keyframes slide { from { left: -36%; } to { left: 104%; } }

  .empty {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: rgba(186, 204, 228, .7); font: 400 13px/1.6 var(--sans); text-align: center;
    background: radial-gradient(600px 300px at 50% 40%, rgba(125, 211, 252, .08), transparent 70%), #070b12;
    padding: 24px;
  }

  /* ---------- find bar ---------- */
  .findbar {
    position: absolute; top: 10px; right: 14px; z-index: 18;
    display: none; align-items: center; gap: 6px;
    padding: 6px 8px 6px 12px;
    border-radius: var(--r-pill);
    border: 1px solid var(--glass-line-hi);
    background: rgba(9, 14, 25, .94);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: var(--shadow);
  }
  .findbar.on { display: flex; }
  .findbar input {
    border: 0; outline: 0; background: transparent;
    color: #e6eefb; font: 400 12px/1 var(--sans);
    width: 150px; padding: 4px 0;
  }
  .findbar button {
    width: 22px; height: 22px; display: grid; place-items: center;
    border-radius: 6px; border: 0; background: transparent;
    color: rgba(200, 216, 238, .8); cursor: pointer;
  }
  .findbar button:hover { background: rgba(148, 176, 214, .18); color: #fff; }
  .findbar button svg { width: 12px; height: 12px; }

  /* ---------- status bar ---------- */
  .statusbar {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 16;
    display: none; align-items: center; gap: 12px;
    padding: 5px 12px;
    font: 500 10px/1 var(--mono); letter-spacing: .06em;
    color: rgba(186, 204, 228, .66);
    background: rgba(6, 10, 17, .92);
    border-top: 1px solid rgba(148, 163, 184, .14);
  }
  .statusbar.on { display: flex; }
  .statusbar .sp { flex: 1; }

  @media (max-width: 900px) {
    .brand .txt, .bar .pill-btn .lbl { display: none; }
    .bar { gap: 6px; padding: 8px; }
    .navgroup .iconbtn { width: 30px; height: 30px; }
    .seg button { padding: 7px 8px; }
    .seg button .t { display: none; }
    .addr { padding-left: 10px; }
    .viewport { margin: 0 8px calc(8px + env(safe-area-inset-bottom)); border-radius: 13px; }
  }
  @media (max-width: 620px) {
    .brand { display: none; }
    #copyBtn, #tabsBtn { display: none; }
    .tabstrip { padding: 6px 8px 0; }
  }
</style>
</head>
<body>

<div class="backdrop" id="backdrop">
  <img class="bgimg" src="/assets/bg-night.jpg" alt="" aria-hidden="true" draggable="false">
  <div class="grain" aria-hidden="true"></div>
</div>

<div class="tabstrip" id="tabstrip" role="tablist" aria-label="Open pages"></div>

<div class="bar">
  <a class="brand" href="/" title="Back to Relay Hub">
    <span class="mark">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 3.2a8.8 8.8 0 105.9 15.2A10.4 10.4 0 0112 3.2z" fill="currentColor"/></svg>
    </span>
    <span class="txt"><b>relay</b><i>hub</i></span>
  </a>

  <div class="navgroup">
    <button class="iconbtn" id="back" title="Back (Alt+←)" aria-label="Back" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 19l-7-7 7-7"/></svg>
    </button>
    <button class="iconbtn" id="forward" title="Forward (Alt+→)" aria-label="Forward" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <button class="iconbtn" id="reload" title="Reload (Ctrl+R)" aria-label="Reload">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-2.6-6.4M21 3v6h-6"/></svg>
    </button>
    <button class="iconbtn" id="home" title="Hub" aria-label="Relay Hub">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.2L12 3l9 7.2"/><path d="M5.2 9.4V21h13.6V9.4"/></svg>
    </button>
  </div>

  <form class="addr" id="addrForm" autocomplete="off">
    <span class="lock" id="lockIcon" title="Proxied through Relay">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.6a4 4 0 018 0v2.9"/></svg>
    </span>
    <input id="url" type="text" placeholder="Paste a link, or type to search…" spellcheck="false" autocapitalize="off" autocorrect="off" aria-label="Address and search">
    <button class="go-btn" type="submit" title="Go" aria-label="Go">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
    </button>
  </form>

  <div class="split">
    <div class="seg" role="group" aria-label="Rendering mode">
      <button id="mFull" title="Full mode — page JavaScript on" aria-pressed="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.5H11L9.5 22 19 10h-6.5L13 2z"/></svg>
        <span class="t">Full</span>
      </button>
      <button id="mReader" title="Reader mode — scripts off, clean text" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 016.5 3H20v15.5a2.5 2.5 0 00-2.5-2.5H4V5.5z"/><path d="M4 16.5h13.5"/></svg>
        <span class="t">Reader</span>
      </button>
    </div>
  </div>

  <button class="iconbtn" id="tabsBtn" title="Toggle tab strip" aria-label="Toggle tabs">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="14" height="13" rx="2.5"/><path d="M7 3h11a2 2 0 012 2v11"/></svg>
  </button>
  <button class="iconbtn" id="findBtn" title="Find in page (Ctrl+F)" aria-label="Find in page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
  </button>
  <button class="pill-btn" id="copyBtn" title="Copy a shareable link to this proxied page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2.2"/><path d="M5 15V5a2 2 0 012-2h10"/></svg>
    <span class="lbl">Copy link</span>
  </button>
</div>

<div class="viewport" id="viewport">
  <div class="progress" id="progress"></div>
  <iframe id="frame" title="Proxied page" referrerpolicy="unsafe-url" allow="fullscreen; clipboard-write; autoplay" allowfullscreen></iframe>

  <div class="findbar" id="findbar">
    <input id="findInput" type="text" placeholder="Find in page…" aria-label="Find in page">
    <button id="findClose" title="Close" aria-label="Close find">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <div class="statusbar" id="statusbar">
    <span id="stMode">full</span>
    <span id="stStatus">ready</span>
    <span class="sp"></span>
    <span id="stTime">—</span>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

  var store = {
    get: function (k, d) { try { var v = localStorage.getItem('relay.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem('relay.' + k, JSON.stringify(v)); } catch (e) {} }
  };

  var ENGINES = {
    duckduckgo: 'https://html.duckduckgo.com/html/?q=',
    bing: 'https://www.bing.com/search?q=',
    brave: 'https://search.brave.com/search?q=',
    wikipedia: 'https://en.wikipedia.org/w/index.php?search=',
    mojeek: 'https://www.mojeek.com/search?q=',
    startpage: 'https://www.startpage.com/sp/search?query=',
    ecosia: 'https://www.ecosia.org/search?q=',
    google: 'https://www.google.com/search?q='
  };

  /* ================= state ================= */
  var tabs = [];
  var active = -1;
  var showTabs = store.get('showTabs', true);

  var frame = $('#frame'), urlBar = $('#url'), progress = $('#progress'), viewport = $('#viewport');
  var loadTimer = null, lastLoadAt = 0;

  function prefs() {
    return {
      mode: store.get('mode', 'full'),
      engine: store.get('engine', 'duckduckgo')
    };
  }

  function toast(msg) {
    var el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.classList.remove('show'); }, 2600);
  }

  /* ================= tabs ================= */
  function currentTab() { return tabs[active] || null; }

  function newTab(url) {
    var tab = { url: url || '', title: '', history: [], index: -1, mode: prefs().mode };
    if (url) { tab.history.push(url); tab.index = 0; }
    tabs.push(tab);
    active = tabs.length - 1;
    renderTabs();
    return tab;
  }

  function closeTab(i) {
    tabs.splice(i, 1);
    if (!tabs.length) {
      newTab('');
    } else {
      if (i < active) active--;
      else if (i === active) active = Math.min(active, tabs.length - 1);
    }
    renderTabs();
    var t = currentTab();
    if (t) {
      if (t.url) navigateTo(t.url, true); else showEmpty();
    }
  }

  function renderTabs() {
    var strip = $('#tabstrip');
    strip.innerHTML = '';
    document.body.classList.toggle('no-tabs', !showTabs);
    if (!showTabs) return;

    tabs.forEach(function (t, i) {
      var el = document.createElement('div');
      el.className = 'tab' + (i === active ? ' on' : '');
      el.setAttribute('role', 'tab');
      el.setAttribute('aria-selected', String(i === active));
      var host = '';
      try { host = t.url ? new URL(t.url).hostname.replace(/^www\./, '') : 'New tab'; } catch (e) { host = 'New tab'; }
      var label = t.title || host;

      el.innerHTML = '<span class="fav">' + (host[0] || '•').toUpperCase() + '</span>' +
        '<span class="tlabel"></span>' +
        '<button class="x" title="Close tab" aria-label="Close tab">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';
      el.querySelector('.tlabel').textContent = label;
      el.title = t.url || 'New tab';

      el.addEventListener('click', function (e) {
        if (e.target.closest('.x')) { e.stopPropagation(); closeTab(i); return; }
        if (i !== active) {
          active = i;
          renderTabs();
          var tb = currentTab();
          if (tb && tb.url) navigateTo(tb.url, true); else showEmpty();
        }
      });
      strip.appendChild(el);
    });

    var plus = document.createElement('button');
    plus.className = 'newtab';
    plus.title = 'New tab (Ctrl+T)';
    plus.setAttribute('aria-label', 'New tab');
    plus.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
    plus.addEventListener('click', function () { newTab(''); showEmpty(); focusUrl(); });
    strip.appendChild(plus);
    strip.scrollLeft = strip.scrollWidth;
  }

  /* ================= address bar ================= */
  function asTarget(v) {
    v = String(v || '').trim();
    if (!v) return null;
    if (/^https?:\/\//i.test(v)) return v;
    if (/^[a-z][a-z0-9+.-]*:(?!\d)/i.test(v) && !/^[\w-]+(\.[\w-]+)+/.test(v)) return null;
    if (/^(?:[\w-]+\.)+[a-z]{2,63}(?::\d{1,5})?(?:[/?#].*)?$/i.test(v)) return 'https://' + v;
    if (/^(?:localhost|\d{1,3}(?:\.\d{1,3}){3})(?::\d{1,5})?(?:\/.*)?$/i.test(v)) return 'http://' + v;
    var e = ENGINES[prefs().engine] || ENGINES.duckduckgo;
    return e + encodeURIComponent(v);
  }

  function proxyUrlFor(target, mode) {
    return '/p/' + b64url(target) + ((mode || currentMode()) === 'reader' ? '?m=1' : '');
  }

  function b64url(str) {
    return btoa(unescape(encodeURIComponent(str))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  function currentMode() {
    var t = currentTab();
    return (t && t.mode) || prefs().mode;
  }

  function setMode(mode, silent) {
    var t = currentTab();
    if (t) t.mode = mode;
    paintMode();
    if (t && t.url && !silent) reloadPage();
  }

  function paintMode() {
    var m = currentMode();
    $('#mFull').classList.toggle('on', m !== 'reader');
    $('#mReader').classList.toggle('on', m === 'reader');
    $('#mFull').setAttribute('aria-pressed', String(m !== 'reader'));
    $('#mReader').setAttribute('aria-pressed', String(m === 'reader'));
    $('#stMode').textContent = m;
  }

  /* ================= navigation ================= */
  function updateHistoryButtons() {
    var t = currentTab();
    $('#back').disabled = !t || t.index <= 0;
    $('#forward').disabled = !t || t.index >= t.history.length - 1;
  }

  function navigateTo(url, fromHistory) {
    var t = currentTab();
    if (!t) t = newTab(url);
    if (!fromHistory) {
      // Truncate any forward history, then push.
      t.history = t.history.slice(0, t.index + 1);
      if (t.history[t.history.length - 1] !== url) t.history.push(url);
      t.index = t.history.length - 1;
    }
    t.url = url;
    t.title = '';
    urlBar.value = url;
    setLockFor(url);
    paintStatus('loading');

    progress.classList.add('on');
    lastLoadAt = Date.now();
    clearTimeout(loadTimer);
    loadTimer = setTimeout(function () {
      progress.classList.remove('on');
      paintStatus('slow');
    }, 25000);

    frame.src = proxyUrlFor(url);
    document.title = url.replace(/^https?:\/\//, '').split('/')[0] + ' — Relay';
    updateHistoryButtons();
    renderTabs();
    syncQuery(url);
  }

  function showEmpty() {
    progress.classList.remove('on');
    paintStatus('idle');
    if ($('.empty')) return;
    var empty = document.createElement('div');
    empty.className = 'empty';
    empty.innerHTML =
      '<div>' +
      '<div style="font:600 11px/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:rgba(186,204,228,.5);margin-bottom:12px">Nothing loaded</div>' +
      '<div style="font:300 22px/1.3 var(--sans);color:#eaf2ff;margin-bottom:10px">Paste a link to begin</div>' +
      '<div style="max-width:380px;margin:0 auto">The address bar above takes a URL or a search. Try ' +
      '<b style="color:#cfe4ff">wikipedia.org</b>, <b style="color:#cfe4ff">news.ycombinator.com</b> or any site.</div>' +
      '</div>';
    viewport.appendChild(empty);
    frame.src = 'about:blank';
    urlBar.value = '';
    document.title = 'Relay — Browse';
    updateHistoryButtons();
  }

  function clearEmpty() {
    var e = viewport.querySelector('.empty');
    if (e) e.remove();
  }

  function setLockFor(url) {
    var lock = $('#lockIcon');
    var secure = /^https:/i.test(url);
    lock.classList.toggle('insecure', !secure);
    lock.title = secure ? 'Secure link, proxied through Relay' : 'Insecure (http) link, proxied through Relay';
  }

  function reloadPage() {
    var t = currentTab();
    if (!t || !t.url) return;
    progress.classList.add('on');
    paintStatus('loading');
    clearTimeout(loadTimer);
    loadTimer = setTimeout(function () { progress.classList.remove('on'); paintStatus('slow'); }, 25000);
    frame.src = proxyUrlFor(t.url) + (t.url.indexOf('?') >= 0 ? '&' : '?') + '_r=' + Date.now();
    lastLoadAt = Date.now();
  }

  function paintStatus(state) {
    var el = $('#stStatus');
    var map = { idle: 'ready', loading: 'loading…', done: 'loaded', slow: 'still loading…', error: 'error' };
    el.textContent = map[state] || state;
    $('#stTime').textContent = lastLoadAt ? (Math.max(1, Math.round((Date.now() - lastLoadAt) / 1000)) + 's') : '—';
  }

  function syncQuery(url) {
    try {
      var q = '/browse?url=' + encodeURIComponent(url) + (currentMode() === 'reader' ? '&m=1' : '');
      history.replaceState(null, '', q);
    } catch (e) {}
  }

  /* ================= frame events ================= */
  frame.addEventListener('load', function () {
    clearTimeout(loadTimer);
    progress.classList.remove('on');
    var took = Date.now() - lastLoadAt;
    $('#stTime').textContent = Math.max(1, Math.round(took / 1000)) + 's';
    paintStatus('done');
    setTimeout(syncFromFrame, 60);
    setTimeout(syncFromFrame, 600);
  });

  var NOISE = /\/favicon\.(ico|png)|reportActivity|adclick|\/beacon|analytics|tracking|\/pixel|log\.php|telemetry|mmasync|doubleclick|googlesyndication/i;

  function syncFromFrame() {
    if (!frame.contentWindow) return;
    var href;
    try { href = frame.contentWindow.location.href; } catch (e) { return; }
    if (!href || href === 'about:blank') return;

    var real = null;
    try {
      var u = new URL(href, location.href);
      if (u.pathname.indexOf('/p/') === 0) {
        var seg = u.pathname.slice(3).split('/')[0];
        real = decodeB64(seg);
      } else if (u.pathname === '/fetch' || u.pathname === '/raw') {
        real = u.searchParams.get('url');
      }
    } catch (e) { return; }

    if (!real || NOISE.test(real)) return;
    var t = currentTab();
    if (!t || real === t.url) return;

    // In-frame navigation: record it as a new history entry.
    t.history = t.history.slice(0, t.index + 1);
    t.history.push(real);
    t.index = t.history.length - 1;
    t.url = real;
    urlBar.value = real;
    setLockFor(real);
    setSource(real);
    updateHistoryButtons();
    renderTabs();
    syncQuery(real);
    pushRecent(real);
  }

  function setSource(url) {
    var t = currentTab();
    if (t) t.source = url;
  }

  function decodeB64(seg) {
    try {
      var s = seg.replace(/-/g, '+').replace(/_/g, '/');
      return decodeURIComponent(escape(atob(s)));
    } catch (e) { return null; }
  }

  window.addEventListener('message', function (e) {
    if (e.source !== frame.contentWindow) return;
    var d = e.data || {};
    if (!d || !d.__relay) return;
    if (d.type === 'nav') {
      progress.classList.remove('on');
      paintStatus('done');
      if (d.title) {
        var t = currentTab();
        if (t) { t.title = d.title; renderTabs(); }
        document.title = (d.title || 'Relay') + ' — Relay';
      }
      syncFromFrame();
    }
  });

  function pushRecent(url) {
    var list = store.get('recent', []).filter(function (r) { return r.url !== url; });
    list.unshift({ url: url, at: Date.now() });
    store.set('recent', list.slice(0, 12));
  }

  /* ================= settings sheet ================= */
  var settingsEl = null;
  function openSettings() {
    if (settingsEl) return;
    var wrap = document.createElement('div');
    wrap.className = 'sheet-scrim';
    wrap.style.cssText = 'position:fixed;inset:0;z-index:60;background:rgba(3,6,12,.66);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px';
    wrap.innerHTML =
      '<div style="width:min(520px,100%);max-height:82vh;overflow:auto;background:rgba(11,17,27,.97);border:1px solid var(--glass-line);border-radius:18px;padding:22px;box-shadow:0 40px 100px -30px #000">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">' +
      '<h2 style="margin:0;font:600 15px/1 var(--sans);letter-spacing:.02em">Browser settings</h2>' +
      '<button class="iconbtn" id="stClose" aria-label="Close"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>' +
      '</div>' +
      '<div id="stBody"></div>' +
      '</div>';
    document.body.appendChild(wrap);
    settingsEl = wrap;

    function close() { if (wrap.parentNode) wrap.parentNode.removeChild(wrap); settingsEl = null; }
    wrap.addEventListener('click', function (e) { if (e.target === wrap) close(); });
    $('#stClose', wrap).addEventListener('click', close);

    var body = $('#stBody', wrap);
    body.style.cssText = 'display:flex;flex-direction:column;gap:14px';

    body.innerHTML =
      row('Default view mode', 'Full keeps site JavaScript so logins work. Reader strips scripts for clean reading.',
        '<div class="seg6" data-key="mode"><button data-v="full">Full</button><button data-v="reader">Reader</button></div>') +
      row('Search engine', 'Used when you type words instead of an address.',
        '<div class="seg6" data-key="engine">' + Object.keys(ENGINES).map(function (k) {
          return '<button data-v="' + k + '">' + (k === 'duckduckgo' ? 'DDG' : k[0].toUpperCase() + k.slice(1)) + '</button>';
        }).join('') + '</div>') +
      row('Tab strip', 'Show open pages above the address bar.',
        '<button class="switchbtn" data-key="showTabs" role="switch"></button>') +
      row('Show status bar', 'Mode, load state and timing under the page.',
        '<button class="switchbtn" data-key="status" role="switch"></button>') +
      row('Clear proxied cookies', 'Signs you out of every proxied site on this device.',
        '<button class="pill-btn" id="stCookies" style="padding:8px 12px">Clear</button>') +
      row('Clear history', 'Removes “Jump back in” shortcuts stored in this browser only.',
        '<button class="pill-btn" id="stHistory" style="padding:8px 12px">Clear</button>');

    var css = document.createElement('style');
    css.textContent =
      '.seg6{display:flex;gap:2px;padding:3px;border-radius:999px;border:1px solid var(--glass-line);background:rgba(9,15,26,.6);flex-wrap:wrap;justify-content:flex-end}' +
      '.seg6 button{border:0;background:transparent;color:rgba(186,204,228,.78);font:600 10.5px/1 var(--sans);padding:7px 9px;border-radius:999px;cursor:pointer}' +
      '.seg6 button.on{background:linear-gradient(180deg,#e8f4ff,#bcdcfb);color:#10203a}' +
      '.switchbtn{width:40px;height:23px;border-radius:99px;border:1px solid var(--glass-line);background:rgba(9,15,26,.9);position:relative;cursor:pointer;transition:.18s;flex:0 0 auto}' +
      '.switchbtn::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:99px;background:#8fa4bd;transition:.18s}' +
      '.switchbtn.on{background:linear-gradient(90deg,#34d399,#22d3ee);border-color:transparent}' +
      '.switchbtn.on::after{left:19px;background:#04110c}' +
      '.srow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:14px;border-bottom:1px solid rgba(148,163,184,.12)}' +
      '.srow:last-child{border-bottom:0;padding-bottom:0}' +
      '.srow .t{font:600 12.5px/1.3 var(--sans);color:#e6eefb;margin-bottom:3px}' +
      '.srow .d{font:400 11px/1.4 var(--sans);color:rgba(160,182,210,.72);max-width:280px}';
    wrap.appendChild(css);

    // wire
    function paintSwitches() {
      $$('.switchbtn', wrap).forEach(function (b) {
        var k = b.getAttribute('data-key');
        var on = k === 'showTabs' ? store.get('showTabs', true) : store.get('status', true);
        b.classList.toggle('on', !!on);
        b.setAttribute('aria-checked', String(!!on));
      });
      $$('.seg6', wrap).forEach(function (seg) {
        var k = seg.getAttribute('data-key');
        var v = k === 'mode' ? prefs().mode : prefs().engine;
        $$('button', seg).forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-v') === v); });
      });
    }
    paintSwitches();

    $$('.seg6 button', wrap).forEach(function (b) {
      b.addEventListener('click', function () {
        var k = b.parentNode.getAttribute('data-key');
        var v = b.getAttribute('data-v');
        if (k === 'mode') { store.set('mode', v); setMode(v); }
        else { store.set('engine', v); toast('Search engine: ' + v); }
        paintSwitches();
      });
    });

    $$('.switchbtn', wrap).forEach(function (b) {
      b.addEventListener('click', function () {
        var k = b.getAttribute('data-key');
        if (k === 'showTabs') {
          showTabs = !showTabs;
          store.set('showTabs', showTabs);
          renderTabs();
        } else {
          var v = !store.get('status', true);
          store.set('status', v);
          $('#statusbar').classList.toggle('on', v);
        }
        paintSwitches();
      });
    });

    $('#stCookies', wrap).addEventListener('click', function () {
      fetch('/api/cookies', { method: 'DELETE' }).then(function () {
        toast('Proxied cookies cleared');
      }).catch(function () { toast('Couldn’t clear cookies'); });
    });
    $('#stHistory', wrap).addEventListener('click', function () {
      store.set('recent', []);
      toast('History cleared');
    });
  }

  function row(title, desc, control) {
    return '<div class="srow"><div><div class="t">' + title + '</div><div class="d">' + desc + '</div></div>' + control + '</div>';
  }

  /* ================= find in page ================= */
  function openFind() {
    $('#findbar').classList.add('on');
    var i = $('#findInput');
    i.focus();
    i.select();
  }
  function closeFind() { $('#findbar').classList.remove('on'); }
  $('#findBtn').addEventListener('click', function () {
    if ($('#findbar').classList.contains('on')) closeFind(); else openFind();
  });
  $('#findClose').addEventListener('click', closeFind);
  $('#findInput').addEventListener('input', function (e) {
    var q = e.target.value;
    if (!q) return;
    try { frame.contentWindow.postMessage({ __relayCmd: 1, cmd: 'find', q: q }, '*'); } catch (x) {}
  });
  $('#findInput').addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeFind(); urlBar.focus(); }
    if (e.key === 'Enter') {
      try { frame.contentWindow.postMessage({ __relayCmd: 1, cmd: 'find', q: e.target.value }, '*'); } catch (x) {}
    }
  });

  /* ================= wiring ================= */
  $('#addrForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var t = asTarget(urlBar.value);
    if (!t) { urlBar.focus(); return; }
    navigateTo(t);
    urlBar.blur();
  });

  urlBar.addEventListener('focus', function () { urlBar.select(); });
  urlBar.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { urlBar.blur(); }
  });

  $('#back').addEventListener('click', function () {
    var t = currentTab();
    if (!t || t.index <= 0) return;
    t.index--;
    navigateTo(t.history[t.index], true);
  });
  $('#forward').addEventListener('click', function () {
    var t = currentTab();
    if (!t || t.index >= t.history.length - 1) return;
    t.index++;
    navigateTo(t.history[t.index], true);
  });
  $('#reload').addEventListener('click', reloadPage);
  $('#home').addEventListener('click', function () { location.href = '/'; });
  $('#tabsBtn').addEventListener('click', function () {
    showTabs = !showTabs;
    store.set('showTabs', showTabs);
    renderTabs();
  });

  $('#mFull').addEventListener('click', function () { setMode('full'); });
  $('#mReader').addEventListener('click', function () { setMode('reader'); });

  $('#copyBtn').addEventListener('click', function () {
    var t = currentTab();
    if (!t || !t.url) return toast('Open a page first');
    var link = location.origin + proxyUrlFor(t.url);
    var done = function () { toast('Shareable link copied'); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(link).then(done, fallback);
    } else fallback();
    function fallback() {
      try {
        var ta = document.createElement('textarea');
        ta.value = link; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
        done();
      } catch (e) { toast('Couldn’t copy — select the address bar'); }
    }
  });

  /* ================= keyboard ================= */
  document.addEventListener('keydown', function (e) {
    var typing = (document.activeElement && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName));
    var mod = e.ctrlKey || e.metaKey;

    if (e.altKey && e.key === 'ArrowLeft') { e.preventDefault(); $('#back').click(); }
    else if (e.altKey && e.key === 'ArrowRight') { e.preventDefault(); $('#forward').click(); }
    else if (mod && e.key.toLowerCase() === 'l') { e.preventDefault(); urlBar.focus(); urlBar.select(); }
    else if (mod && e.key.toLowerCase() === 'r') { e.preventDefault(); reloadPage(); }
    else if (mod && e.key.toLowerCase() === 'f') { e.preventDefault(); openFind(); }
    else if (mod && e.key.toLowerCase() === 't') { e.preventDefault(); newTab(''); showEmpty(); focusUrl(); }
    else if (mod && e.key.toLowerCase() === 'w') { e.preventDefault(); closeTab(active); }
    else if (e.key === '/' && !typing) { e.preventDefault(); urlBar.focus(); urlBar.select(); }
    else if (e.key === 'Escape' && typing) { document.activeElement.blur(); }
  });

  function focusUrl() { try { urlBar.focus(); urlBar.select(); } catch (e) {} }

  /* ================= boot ================= */
  $('#statusbar').classList.toggle('on', store.get('status', true));

  var qs = new URLSearchParams(location.search);
  var startUrl = qs.get('url') || '';
  if (qs.get('m') === '1') {
    store.set('mode', 'reader');
  } else if (qs.get('m') === '0') {
    store.set('mode', 'full');
  }

  newTab(startUrl);
  renderTabs();
  paintMode();

  if (startUrl) {
    navigateTo(startUrl, true);
  } else {
    // Restore the last session's tabs if there are any.
    var saved = store.get('tabs', []);
    if (saved && saved.length) {
      tabs = saved.map(function (s) {
        return { url: s.url || '', title: s.title || '', history: s.url ? [s.url] : [], index: s.url ? 0 : -1, mode: s.mode || prefs().mode };
      });
      active = Math.min(store.get('activeTab', 0), tabs.length - 1);
      renderTabs();
      paintMode();
      var t = currentTab();
      if (t && t.url) navigateTo(t.url, true); else showEmpty();
    } else {
      showEmpty();
      setTimeout(focusUrl, 250);
    }
  }

  // Persist tabs so a reload doesn't lose the session.
  function persist() {
    try {
      store.set('tabs', tabs.map(function (t) { return { url: t.url, title: t.title, mode: t.mode }; }));
      store.set('activeTab', active);
    } catch (e) {}
  }
  window.addEventListener('beforeunload', persist);
  setInterval(persist, 4000);

  setInterval(function () {
    if (lastLoadAt) paintStatus($('#stStatus').textContent === 'loading…' ? 'loading' : 'done');
  }, 1000);
})();
</script>
</body>
</html>
