<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>2048 — Pine</title>
<style>
  body{margin:0;background:#0a140d;color:#eaf5ee;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:1rem;box-sizing:border-box}
  h1{font-family:Georgia,serif;font-style:italic;margin:.2rem 0}
  .bar{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;justify-content:center;margin:.5rem 0}
  .pill{background:#122419;border:1px solid #24402e;border-radius:999px;padding:.35rem .8rem;font-size:.85rem;font-weight:650}
  button{background:#35d07f;color:#06240f;border:0;border-radius:10px;padding:.5rem .95rem;font-weight:700;cursor:pointer}
  #board{position:relative;width:min(440px,92vw);aspect-ratio:1;background:#122419;border:1px solid #24402e;border-radius:16px;touch-action:none}
  .slot{position:absolute;background:#0d1f13;border-radius:10px}
  .tile{position:absolute;display:grid;place-items:center;border-radius:10px;font-weight:800;transition:left .11s ease,top .11s ease;will-change:left,top}
  .hint{color:#73907e;font-size:.8rem;text-align:center}
  #over{position:absolute;inset:0;background:rgba(4,12,7,.8);display:none;place-items:center;border-radius:16px;text-align:center;z-index:5}
  #over h2{font-family:Georgia,serif;font-style:italic;margin:0 0 .4rem}
</style>
<h1>🔢 2048</h1>
<div class="bar">
  <span class="pill">Score <b id="score">0</b></span>
  <span class="pill">Best <b id="best">0</b></span>
  <span class="pill">🪙 <b id="coins">0</b></span>
  <button id="new">New game</button>
</div>
<div id="board"><div id="over"><div><h2 id="over-title">game over</h2><p id="over-sub"></p><button onclick="reset()">Play again</button></div></div></div>
<p class="hint">Arrow keys / WASD / swipe. Every merge pays: tile value ÷ 512 coins, rounded up. Reach 2048 for a 25-coin bonus.</p>
<script>
"use strict";
const boardEl=document.getElementById("board");
const pineCoins=n=>{try{parent.postMessage({pineCoins:n},"*")}catch(e){}};
const COLORS={2:["#1d4429","#b8e6c8"],4:["#26603a","#dff7e7"],8:["#2f9e63","#06240f"],16:["#35d07f","#06240f"],32:["#7ee2a8","#06240f"],64:["#f5c451","#2e1f04"],128:["#ffb26b","#2e1404"],256:["#ff8fa3","#33050f"],512:["#c4a7fd","#170b33"],1024:["#6cb8ff","#04122e"],2048:["#ffd700","#2e1f04"]};
let grid,score,won,paid;
let best=Number(localStorage.getItem("pine.2048.best")||0);
document.getElementById("best").textContent=best;
// background slots
const P=2.2,S=(100-P*5)/4;
for(let r=0;r<4;r++)for(let c=0;c<4;c++){
  const s=document.createElement("div");s.className="slot";
  s.style.cssText=`left:${P+c*(S+P)}%;top:${P+r*(S+P)}%;width:${S}%;height:${S}%`;
  boardEl.appendChild(s);
}
const pos=(r,c)=>`left:${P+c*(S+P)}%;top:${P+r*(S+P)}%;width:${S}%;height:${S}%;font-size:clamp(15px,4.6vw,28px)`;
let tiles=new Map();let seq=0;
function newTile(r,c,v){
  const el=document.createElement("div");el.className="tile";
  el.style.cssText=pos(r,c);setTileStyle(el,v);
  el.textContent=v;boardEl.appendChild(el);
  const t={id:++seq,r,c,v,el};tiles.set(t.id,t);return t;
}
function setTileStyle(el,v){const[bg,fg]=COLORS[v]||COLORS[2048];el.style.background=bg;el.style.color=fg}
function spawn(){
  const empty=[];
  grid.forEach((row,r)=>row.forEach((cell,c)=>{if(!cell)empty.push([r,c])}));
  if(!empty.length)return;
  const[r,c]=empty[Math.floor(Math.random()*empty.length)];
  grid[r][c]=newTile(r,c,Math.random()<.9?2:4);
}
function reset(){
  for(const t of tiles.values())t.el.remove();
  tiles=new Map();grid=Array.from({length:4},()=>Array(4).fill(null));
  score=0;won=false;paid=0;
  document.getElementById("over").style.display="none";
  spawn();spawn();update();
}
function update(){
  document.getElementById("score").textContent=score;
  document.getElementById("coins").textContent=paid;
  if(score>best){best=score;localStorage.setItem("pine.2048.best",best);document.getElementById("best").textContent=best}
}
function payFor(v){
  const n=Math.max(0,Math.ceil(v/512));
  if(n>0){paid+=n;pineCoins(n)}
}
function slideLine(line){
  // line: array of tiles-or-null in movement order. Returns {line, gained, moved}
  const vals=line.filter(Boolean);
  const out=[];let gained=0;
  for(let i=0;i<vals.length;i++){
    if(i+1<vals.length&&vals[i].v===vals[i+1].v){
      vals[i].v*=2;gained+=vals[i].v;
      const dead=vals[i+1];
      dead.el.style.cssText=pos(vals[i].r,vals[i].c); // slide into merge target visually
      setTimeout(()=>{dead.el.remove();tiles.delete(dead.id)},110);
      setTileStyle(vals[i].el,vals[i].v);vals[i].el.textContent=vals[i].v;
      payFor(vals[i].v);
      out.push(vals[i]);i++;
    }else out.push(vals[i]);
  }
  while(out.length<4)out.push(null);
  return{line:out,gained,moved:out.some((t,i)=>t!==line[i])};
}
function move(dr,dc){
  if(document.getElementById("over").style.display==="grid")return;
  let moved=false,gained=0;
  const idx=[0,1,2,3];
  for(let k=0;k<4;k++){
    // extract line in movement direction
    let line;
    if(dc===1)line=idx.map(c=>grid[k][3-c]);
    else if(dc===-1)line=idx.map(c=>grid[k][c]);
    else if(dr===1)line=idx.map(r=>grid[3-r][k]);
    else line=idx.map(r=>grid[r][k]);
    const res=slideLine(line);
    res.line.forEach((t,i)=>{
      let r,c;
      if(dc===1){r=k;c=3-i}else if(dc===-1){r=k;c=i}
      else if(dr===1){r=3-i;c=k}else{r=i;c=k}
      grid[r][c]=t;
      if(t){t.r=r;t.c=c;t.el.style.cssText=pos(r,c);setTileStyle(t.el,t.v);t.el.textContent=t.v}
    });
    if(res.moved)moved=true;
    gained+=res.gained;
  }
  if(!moved)return;
  score+=gained;
  spawn();update();
  if(!won&&[...tiles.values()].some(t=>t.v>=2048)){won=true;pineCoins(25);over("you made 2048! 🎉","Keep going for 4096? Close this and carry on.",false)}
  else if(!canMove())over("game over",`Final score ${score}.`,true);
}
function canMove(){
  for(let r=0;r<4;r++)for(let c=0;c<4;c++){
    if(!grid[r][c])return true;
    if(c<3&&grid[r][c].v===grid[r][c+1]?.v)return true;
    if(r<3&&grid[r][c].v===grid[r+1][c]?.v)return true;
  }
  return false;
}
function over(title,sub,block){
  document.getElementById("over-title").textContent=title;
  document.getElementById("over-sub").textContent=sub;
  const el=document.getElementById("over");el.style.display="grid";
  if(!block)setTimeout(()=>el.style.display="none",2600);
}
addEventListener("keydown",e=>{
  const m={ArrowLeft:[0,-1],ArrowRight:[0,1],ArrowUp:[-1,0],ArrowDown:[1,0],a:[0,-1],d:[0,1],w:[-1,0],s:[1,0]};
  if(m[e.key]){move(...m[e.key]);e.preventDefault()}
});
let tx=0,ty=0;
boardEl.addEventListener("touchstart",e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
boardEl.addEventListener("touchend",e=>{
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)+Math.abs(dy)<26)return;
  if(Math.abs(dx)>Math.abs(dy))move(0,dx>0?1:-1);else move(dy>0?1:-1,0);
});
document.getElementById("new").addEventListener("click",reset);
reset();
</script>
