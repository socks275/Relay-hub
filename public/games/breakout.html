<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Breakout — Pine</title>
<style>
  body{margin:0;background:#0a140d;color:#eaf5ee;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:1rem;box-sizing:border-box}
  h1{font-family:Georgia,serif;font-style:italic;margin:.2rem 0}
  .bar{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;justify-content:center;margin:.5rem 0}
  .pill{background:#122419;border:1px solid #24402e;border-radius:999px;padding:.35rem .8rem;font-size:.85rem;font-weight:650}
  button{background:#35d07f;color:#06240f;border:0;border-radius:10px;padding:.5rem .95rem;font-weight:700;cursor:pointer}
  canvas{background:#0d1f13;border:1px solid #24402e;border-radius:14px;max-width:94vw;height:auto;touch-action:none;cursor:none}
  .hint{color:#73907e;font-size:.8rem;text-align:center}
</style>
<h1>🏓 breakout</h1>
<div class="bar">
  <span class="pill">Score <b id="score">0</b></span>
  <span class="pill">Level <b id="level">1</b></span>
  <span class="pill">Lives <b id="lives">❤️❤️❤️</b></span>
  <span class="pill">🪙 <b id="coins">0</b></span>
  <button id="restart">Restart</button>
</div>
<canvas id="cv" width="640" height="460"></canvas>
<p class="hint">Mouse, touch or ← →. Click / Space to launch. Catch ⬌ wide, ✦ multi-ball, ◐ slow-mo. Clear a level for 8 🪙, every 300 points pays 1 🪙.</p>
<script>
"use strict";
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
const pineCoins=n=>{try{parent.postMessage({pineCoins:n},"*")}catch(e){}};
const ROWCOL=["#ff8fa3","#ffb26b","#f5c451","#35d07f","#6cb8ff","#c4a7fd"];
let paddle,balls,bricks,powers,score,lives,level,coins,paidMarks,state; // state: ready|play|over|win
function buildLevel(lv){
  bricks=[];
  const cols=10,rows=Math.min(4+lv,8),bw=58,bh=20,gapX=5,offX=(640-cols*(bw+gapX)+gapX)/2,offY=56;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    if(lv>1&&r>1&&(c+r+lv)%7===0)continue; // sprinkle gaps on later levels
    bricks.push({x:offX+c*(bw+gapX),y:offY+r*(bh+6),w:bw,h:bh,hp:r===0&&lv>1?2:1,color:ROWCOL[r%ROWCOL.length],alive:true});
  }
}
function newBall(stuck){
  return{x:paddle.x+paddle.w/2,y:paddle.y-9,r:7,vx:2.4*(Math.random()<.5?-1:1),vy:-4.4,stuck:!!stuck};
}
function reset(full){
  if(full){score=0;lives=3;level=1;coins=0;paidMarks=0}
  paddle={w:96,h:13,x:272,y:428,wideUntil:0};
  balls=[newBall(true)];powers=[];state="ready";
  buildLevel(level);update();
}
function update(){
  document.getElementById("score").textContent=score;
  document.getElementById("level").textContent=level;
  document.getElementById("lives").textContent="❤️".repeat(Math.max(0,lives))||"—";
  document.getElementById("coins").textContent=coins;
}
function payScoreCoins(){
  const marks=Math.floor(score/300);
  if(marks>paidMarks){coins+=marks-paidMarks;pineCoins(marks-paidMarks);paidMarks=marks}
}
function launch(){for(const b of balls)if(b.stuck){b.stuck=false;state="play"}}
function dropPower(x,y){
  const kinds=[["wide","⬌"],["multi","✦"],["slow","◐"]];
  const[kind,icon]=kinds[Math.floor(Math.random()*kinds.length)];
  powers.push({x,y,vy:2.1,kind,icon});
}
let slowUntil=0;
function applyPower(p){
  if(p.kind==="wide"){paddle.w=140;paddle.wideUntil=performance.now()+12000}
  if(p.kind==="slow"){slowUntil=performance.now()+7000;for(const b of balls){b.vx*=.62;b.vy*=.62}}
  if(p.kind==="multi"){ // capped at 6 so the field stays readable
    const extra=[];
    for(const b of balls.slice(0,2)){if(balls.length+extra.length>=6)break;const nb={...b,stuck:false};nb.vx=-b.vx||2;extra.push(nb)}
    balls.push(...extra);
  }
}
function step(){
  if(state==="over")return;
  const now=performance.now();
  if(paddle.wideUntil&&now>paddle.wideUntil){paddle.w=96;paddle.wideUntil=0}
  for(const b of balls){
    if(b.stuck){b.x=paddle.x+paddle.w/2;b.y=paddle.y-b.r-1;continue}
    b.x+=b.vx;b.y+=b.vy;
    if(b.x<b.r){b.x=b.r;b.vx*=-1}
    if(b.x>640-b.r){b.x=640-b.r;b.vx*=-1}
    if(b.y<b.r){b.y=b.r;b.vy*=-1}
    // paddle
    if(b.vy>0&&b.y+b.r>=paddle.y&&b.y-b.r<=paddle.y+paddle.h&&b.x>=paddle.x-4&&b.x<=paddle.x+paddle.w+4){
      const rel=(b.x-(paddle.x+paddle.w/2))/(paddle.w/2);
      const speed=Math.hypot(b.vx,b.vy);
      const ang=Math.max(-1.1,Math.min(1.1,rel*1.05));
      b.vx=speed*Math.sin(ang);b.vy=-speed*Math.cos(ang);
      b.y=paddle.y-b.r-1;
    }
    // bricks
    for(const br of bricks){
      if(!br.alive)continue;
      if(b.x+b.r>br.x&&b.x-b.r<br.x+br.w&&b.y+b.r>br.y&&b.y-b.r<br.y+br.h){
        const fromTopBottom=Math.min(Math.abs(b.y+b.r-br.y),Math.abs(b.y-b.r-(br.y+br.h)));
        const fromSide=Math.min(Math.abs(b.x+b.r-br.x),Math.abs(b.x-b.r-(br.x+br.w)));
        if(fromTopBottom<fromSide)b.vy*=-1;else b.vx*=-1;
        br.hp--;score+=40;
        if(br.hp<=0){br.alive=false;score+=60;if(Math.random()<.14)dropPower(br.x+br.w/2,br.y+br.h)}
        payScoreCoins();update();
        break;
      }
    }
  }
  balls=balls.filter(b=>b.y-b.r<480);
  if(!balls.length){
    lives--;
    if(lives<=0){state="over"}
    else{paddle.x=272;balls=[newBall(true)];state="ready"}
    update();
  }
  // powers
  for(const p of powers){
    p.y+=p.vy;
    if(p.y>paddle.y&&p.y<paddle.y+22&&p.x>paddle.x-8&&p.x<paddle.x+paddle.w+8){applyPower(p);p.caught=true}
  }
  powers=powers.filter(p=>!p.caught&&p.y<480);
  // level clear
  if(bricks.every(b=>!b.alive)){
    level++;coins+=8;pineCoins(8);
    paddle.x=272;balls=[newBall(true)];powers=[];state="ready";
    buildLevel(level);update();
  }
}
function draw(){
  ctx.clearRect(0,0,640,460);
  for(const br of bricks){
    if(!br.alive)continue;
    ctx.fillStyle=br.color;ctx.globalAlpha=br.hp===2?1:.82;
    ctx.beginPath();ctx.roundRect(br.x,br.y,br.w,br.h,5);ctx.fill();ctx.globalAlpha=1;
    if(br.hp===2){ctx.fillStyle="rgba(0,0,0,.35)";ctx.fillRect(br.x+br.w/2-7,br.y+br.h/2-1.5,14,3)}
  }
  ctx.fillStyle="#7ee2a8";
  ctx.beginPath();ctx.roundRect(paddle.x,paddle.y,paddle.w,paddle.h,7);ctx.fill();
  for(const b of balls){ctx.fillStyle="#eaf5ee";ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill()}
  ctx.font="17px system-ui";ctx.textAlign="center";
  for(const p of powers){
    ctx.fillStyle="#f5c451";ctx.beginPath();ctx.arc(p.x,p.y,11,0,7);ctx.fill();
    ctx.fillStyle="#2e1f04";ctx.fillText(p.icon,p.x,p.y+6);
  }
  if(state==="ready"){ctx.fillStyle="#a9c2b1";ctx.font="16px system-ui";ctx.fillText("click or press Space to launch",320,330)}
  if(state==="over"){
    ctx.fillStyle="rgba(4,12,7,.8)";ctx.fillRect(0,0,640,460);
    ctx.fillStyle="#eaf5ee";ctx.font="italic 700 36px Georgia";ctx.fillText("game over",320,215);
    ctx.font="16px system-ui";ctx.fillStyle="#a9c2b1";ctx.fillText(`score ${score} · reached level ${level} · press Enter`,320,245);
  }
  if(performance.now()<slowUntil){ctx.fillStyle="rgba(108,184,255,.85)";ctx.font="13px system-ui";ctx.textAlign="left";ctx.fillText("◐ slow-mo",12,20)}
}
function frame(){step();draw();requestAnimationFrame(frame)}
function pointerX(clientX){
  const r=cv.getBoundingClientRect();
  const x=(clientX-r.left)*(640/r.width);
  paddle.x=Math.max(0,Math.min(640-paddle.w,x-paddle.w/2));
}
cv.addEventListener("mousemove",e=>pointerX(e.clientX));
cv.addEventListener("mousedown",()=>launch());
cv.addEventListener("touchmove",e=>{pointerX(e.touches[0].clientX);e.preventDefault()},{passive:false});
cv.addEventListener("touchstart",e=>{pointerX(e.touches[0].clientX);launch()},{passive:true});
const keys={};
addEventListener("keydown",e=>{
  keys[e.key]=true;
  if(e.key===" "){launch();e.preventDefault()}
  if(e.key==="Enter"&&state==="over")reset(true);
});
addEventListener("keyup",e=>keys[e.key]=false);
setInterval(()=>{
  if(keys.ArrowLeft)paddle.x=Math.max(0,paddle.x-7);
  if(keys.ArrowRight)paddle.x=Math.min(640-paddle.w,paddle.x+7);
},16);
document.getElementById("restart").addEventListener("click",()=>reset(true));
reset(true);frame();
</script>
