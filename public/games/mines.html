<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mines — Pine</title>
<style>
  body{margin:0;background:#0a140d;color:#eaf5ee;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:1rem;box-sizing:border-box}
  h1{font-family:Georgia,serif;font-style:italic;margin:.2rem 0}
  .bar{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;justify-content:center;margin:.5rem 0}
  .pill{background:#122419;border:1px solid #24402e;border-radius:999px;padding:.35rem .8rem;font-size:.85rem;font-weight:650}
  button,select{background:#1a3322;color:#eaf5ee;border:1px solid #2c5c40;border-radius:10px;padding:.5rem .8rem;font-weight:650;cursor:pointer}
  .acc{background:#35d07f;color:#06240f;border-color:transparent}
  #grid{display:grid;gap:3px;margin-top:.5rem}
  .c{width:34px;height:34px;border-radius:7px;background:#1d4429;border:1px solid #2c5c40;display:grid;place-items:center;font-weight:800;font-size:.95rem;cursor:pointer;user-select:none}
  .c:hover{background:#26603a}
  .c.open{background:#0d1f13;cursor:default;border-color:#1d3324}
  .c.mine{background:#5c1f1f}
  .c.boom{background:#ff5f5f;color:#fff}
  .hint{color:#73907e;font-size:.8rem;text-align:center;max-width:520px}
  @media(max-width:560px){.c{width:28px;height:28px;font-size:.85rem}}
</style>
<h1>💣 mines</h1>
<div class="bar">
  <span class="pill">💣 <b id="left">10</b></span>
  <span class="pill">⏱ <b id="time">0:00</b></span>
  <span class="pill" id="face">🌲</span>
  <select id="diff">
    <option value="b">Beginner · 9×9 · 10</option>
    <option value="i">Intermediate · 16×16 · 40</option>
    <option value="e">Expert · 16×24 · 70</option>
  </select>
  <button id="flagmode">🚩 flag mode: off</button>
  <button class="acc" id="restart">New game</button>
</div>
<div id="grid"></div>
<p class="hint">Click to reveal, right-click (or flag mode) to flag, click a number to chord. First click is always safe. Win pays 8 / 16 / 30 🪙.</p>
<script>
"use strict";
const pineCoins=n=>{try{parent.postMessage({pineCoins:n},"*")}catch(e){}};
const CONF={b:{r:9,c:9,m:10,pay:8},i:{r:16,c:16,m:40,pay:16},e:{r:16,c:24,m:70,pay:30}};
const NUMCOL=["","#6cb8ff","#35d07f","#ff8fa3","#c4a7fd","#f5c451","#7ae0e0","#e8e8e8","#ffb26b"];
let cfg,grid,started,over,wonGame,flags,opened,t0,timer,flagMode=false,paid=false;
const $=id=>document.getElementById(id);
function setup(){
  cfg=CONF[$("diff").value];
  clearInterval(timer);t0=null;
  started=false;over=false;wonGame=false;flags=0;opened=0;paid=false;
  grid=Array.from({length:cfg.r},()=>Array.from({length:cfg.c},()=>({mine:false,open:false,flag:false,n:0})));
  const g=$("grid");
  g.style.gridTemplateColumns=`repeat(${cfg.c},auto)`;
  g.innerHTML="";
  for(let r=0;r<cfg.r;r++)for(let c=0;c<cfg.c;c++){
    const d=document.createElement("div");
    d.className="c";d.dataset.r=r;d.dataset.c=c;
    d.addEventListener("click",()=>flagMode?toggleFlag(r,c,d):revealClick(r,c));
    d.addEventListener("contextmenu",e=>{e.preventDefault();toggleFlag(r,c,d)});
    g.appendChild(d);
  }
  $("left").textContent=cfg.m;$("time").textContent="0:00";$("face").textContent="🌲";
}
const cellEl=(r,c)=>document.querySelector(`.c[data-r="${r}"][data-c="${c}"]`);
const neighbours=(r,c)=>{const out=[];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;const nr=r+dr,nc=c+dc;if(nr>=0&&nc>=0&&nr<cfg.r&&nc<cfg.c)out.push([nr,nc])}return out};
function plant(safeR,safeC){
  const safe=new Set([`${safeR},${safeC}`,...neighbours(safeR,safeC).map(([r,c])=>`${r},${c}`)]);
  let placed=0;
  while(placed<cfg.m){
    const r=Math.floor(Math.random()*cfg.r),c=Math.floor(Math.random()*cfg.c);
    if(grid[r][c].mine||safe.has(`${r},${c}`))continue;
    grid[r][c].mine=true;placed++;
  }
  for(let r=0;r<cfg.r;r++)for(let c=0;c<cfg.c;c++)
    grid[r][c].n=neighbours(r,c).filter(([nr,nc])=>grid[nr][nc].mine).length;
}
function tick(){
  const s=Math.floor((Date.now()-t0)/1000);
  $("time").textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
}
function revealClick(r,c){
  if(over)return;
  const cell=grid[r][c];
  if(cell.flag)return;
  if(cell.open){chord(r,c);return}
  if(!started){started=true;plant(r,c);t0=Date.now();timer=setInterval(tick,500)}
  reveal(r,c);
  checkWin();
}
function reveal(r,c){
  const cell=grid[r][c];
  if(cell.open||cell.flag)return;
  cell.open=true;opened++;
  const el=cellEl(r,c);el.classList.add("open");
  if(cell.mine){el.classList.add("boom");el.textContent="💥";lose();return}
  if(cell.n>0){el.textContent=cell.n;el.style.color=NUMCOL[cell.n]}
  else for(const[nr,nc]of neighbours(r,c))reveal(nr,nc);
}
function chord(r,c){
  const cell=grid[r][c];
  const nbs=neighbours(r,c);
  if(nbs.filter(([nr,nc])=>grid[nr][nc].flag).length!==cell.n)return;
  for(const[nr,nc]of nbs)if(!grid[nr][nc].flag)reveal(nr,nc);
  checkWin();
}
function toggleFlag(r,c,el){
  if(over)return;
  const cell=grid[r][c];
  if(cell.open)return;
  cell.flag=!cell.flag;
  flags+=cell.flag?1:-1;
  el.textContent=cell.flag?"🚩":"";
  $("left").textContent=cfg.m-flags;
}
function checkWin(){
  if(over)return;
  if(opened===cfg.r*cfg.c-cfg.m){
    wonGame=true;over=true;clearInterval(timer);
    $("face").textContent="😎🏆";
    document.querySelectorAll(".c").forEach((el)=>{
      const r=+el.dataset.r,c=+el.dataset.c;
      if(grid[r][c].mine&&!grid[r][c].flag)el.textContent="🚩";
    });
    if(!paid){pineCoins(cfg.pay);paid=true}
  }
}
function lose(){
  over=true;clearInterval(timer);$("face").textContent="💀";
  for(let r=0;r<cfg.r;r++)for(let c=0;c<cfg.c;c++){
    const cell=grid[r][c],el=cellEl(r,c);
    if(cell.mine&&!cell.open){el.classList.add("mine");el.textContent=cell.flag?"🚩":"💣"}
    if(!cell.mine&&cell.flag){el.textContent="❌"}
  }
}
$("flagmode").addEventListener("click",e=>{flagMode=!flagMode;e.target.textContent=`🚩 flag mode: ${flagMode?"on":"off"}`});
$("restart").addEventListener("click",setup);
$("diff").addEventListener("change",setup);
$("face").addEventListener("click",setup);
setup();
</script>
