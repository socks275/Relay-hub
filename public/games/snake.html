<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pine Snake</title>
<style>
  body{margin:0;background:#0a140d;color:#eaf5ee;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:1rem;box-sizing:border-box}
  h1{font-family:Georgia,serif;font-style:italic;margin:.2rem 0}
  .bar{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;justify-content:center;margin:.5rem 0}
  .pill{background:#122419;border:1px solid #24402e;border-radius:999px;padding:.35rem .8rem;font-size:.85rem;font-weight:650}
  button{background:#1a3322;color:#eaf5ee;border:1px solid #2c5c40;border-radius:10px;padding:.5rem .9rem;font-weight:650;cursor:pointer}
  button:hover{background:#22452f}
  .acc{background:#35d07f;color:#06240f;border-color:transparent}
  canvas{background:#0d1f13;border:1px solid #24402e;border-radius:14px;max-width:92vw;height:auto;touch-action:none}
  .dpad{display:none;grid-template-columns:repeat(3,58px);gap:.35rem;margin-top:.7rem}
  .dpad button{height:52px;font-size:1.1rem}
  @media(pointer:coarse){.dpad{display:grid}}
  .hint{color:#73907e;font-size:.8rem}
  label{font-size:.85rem;color:#a9c2b1}
</style>
<h1>🐍 pine snake</h1>
<div class="bar">
  <span class="pill">Score <b id="score">0</b></span>
  <span class="pill">Best <b id="best">0</b></span>
  <span class="pill">🪙 earned <b id="coins">0</b></span>
  <label><input type="checkbox" id="wrap"> wrap walls</label>
  <label>speed <input type="range" id="speed" min="1" max="10" value="5"></label>
  <button class="acc" id="restart">Restart</button>
</div>
<canvas id="cv" width="480" height="480"></canvas>
<p class="hint">Arrows / WASD / swipe. Golden acorns are worth 5. Every 10 points = 1 real Pine coin 🪙</p>
<div class="dpad">
  <span></span><button data-d="up">▲</button><span></span>
  <button data-d="left">◀</button><button data-d="down">▼</button><button data-d="right">▶</button>
</div>
<script>
"use strict";
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
const N=24,CELL=cv.width/N;
const pineCoins=n=>{try{parent.postMessage({pineCoins:n},"*")}catch(e){}};
let snake,dir,queue,food,golden,score,alive,timer,coinsPaid=0;
let best=Number(localStorage.getItem("pine.snake.best")||0);
document.getElementById("best").textContent=best;
function placeFood(g){
  let x,y;
  do{x=Math.floor(Math.random()*N);y=Math.floor(Math.random()*N)}
  while(snake.some(s=>s.x===x&&s.y===y));
  return {x,y,g:!!g};
}
function reset(){
  snake=[{x:12,y:12},{x:11,y:12},{x:10,y:12}];
  dir={x:1,y:0};queue=[];score=0;alive=true;coinsPaid=0;
  food=placeFood(false);golden=null;
  update();draw();loop();
}
function speedMs(){return 170-document.getElementById("speed").value*13}
function loop(){clearTimeout(timer);if(!alive)return;timer=setTimeout(()=>{step();loop()},speedMs())}
function step(){
  if(queue.length)dir=queue.shift();
  let head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  const wrap=document.getElementById("wrap").checked;
  if(wrap){head.x=(head.x+N)%N;head.y=(head.y+N)%N}
  else if(head.x<0||head.y<0||head.x>=N||head.y>=N)return die();
  if(snake.some(s=>s.x===head.x&&s.y===head.y))return die();
  snake.unshift(head);
  let ate=false;
  if(head.x===food.x&&head.y===food.y){score+=1;ate=true;food=placeFood(false);if(Math.random()<.18&&!golden)golden=placeFood(true)}
  if(golden&&head.x===golden.x&&head.y===golden.y){score+=5;ate=true;golden=null}
  if(!ate)snake.pop();
  const shouldPay=Math.floor(score/10);
  if(shouldPay>coinsPaid){pineCoins(shouldPay-coinsPaid);coinsPaid=shouldPay}
  update();draw();
}
function die(){
  alive=false;
  if(score>best){best=score;localStorage.setItem("pine.snake.best",best);document.getElementById("best").textContent=best}
  draw();
}
function update(){
  document.getElementById("score").textContent=score;
  document.getElementById("coins").textContent=coinsPaid;
}
function cell(x,y,color,r){
  ctx.fillStyle=color;
  ctx.beginPath();ctx.roundRect(x*CELL+1.5,y*CELL+1.5,CELL-3,CELL-3,r||5);ctx.fill();
}
function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.strokeStyle="rgba(53,208,127,.06)";
  for(let i=1;i<N;i++){ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,cv.height);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*CELL);ctx.lineTo(cv.width,i*CELL);ctx.stroke()}
  cell(food.x,food.y,"#ff7a7a",7);
  if(golden)cell(golden.x,golden.y,"#f5c451",9);
  snake.forEach((s,i)=>cell(s.x,s.y,i===0?"#7ee2a8":`rgba(53,208,127,${1-i/snake.length*.55})`,i===0?7:5));
  if(!alive){
    ctx.fillStyle="rgba(4,12,7,.72)";ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle="#eaf5ee";ctx.textAlign="center";
    ctx.font="italic 700 34px Georgia";ctx.fillText("game over",cv.width/2,cv.height/2-10);
    ctx.font="16px system-ui";ctx.fillStyle="#a9c2b1";ctx.fillText(`score ${score} · best ${best} — press Enter or Restart`,cv.width/2,cv.height/2+22);
  }
}
const DIRS={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
function setDir(name){
  const d=DIRS[name];if(!d)return;
  // Validate against the last queued direction (or current heading), so a
  // fast "up then left" turns the corner over two ticks instead of being
  // swallowed — while a true 180° reversal stays impossible.
  const last=queue.length?queue[queue.length-1]:dir;
  if(d.x===-last.x&&d.y===-last.y)return;
  if(d.x===last.x&&d.y===last.y)return;
  if(queue.length<3)queue.push(d);
}
addEventListener("keydown",e=>{
  const map={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right",w:"up",s:"down",a:"left",d:"right"};
  if(map[e.key]){setDir(map[e.key]);e.preventDefault()}
  if(e.key==="Enter"&&!alive)reset();
});
document.querySelectorAll("[data-d]").forEach(b=>b.addEventListener("click",()=>setDir(b.dataset.d)));
let tx=0,ty=0;
cv.addEventListener("touchstart",e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
cv.addEventListener("touchend",e=>{
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)+Math.abs(dy)<24)return;
  setDir(Math.abs(dx)>Math.abs(dy)?(dx>0?"right":"left"):(dy>0?"down":"up"));
});
document.getElementById("restart").addEventListener("click",reset);
reset();
</script>
