# Pine on Render — one-click: https://render.com/deploy?repo=https://github.com/socks275/Relay-hub
# (or manually: New → Blueprint → select this repo.)
services:
  - type: web
    name: pine-hub
    runtime: node
    plan: free
    region: Frankfurt
    buildCommand: npm ci --ignore-scripts
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PINE_PASS
        sync: false # set in the dashboard to password-protect your instance
      - key: PINE_LOG_LEVEL
        value: info
